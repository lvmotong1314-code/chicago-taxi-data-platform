name: Project 1 CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: docker
          POSTGRES_PASSWORD: docker
          POSTGRES_DB: taxi_warehouse
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U docker -d taxi_warehouse"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: docker
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: taxi_warehouse

      PGHOST: localhost
      PGPORT: 5432
      PGUSER: docker
      PGPASSWORD: docker
      PGDATABASE: taxi_warehouse

      CHICAGO_APP_TOKEN: ci-placeholder
      AIRFLOW_UID: 50000
      DOCKER_GID: 999

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Run Python unit tests
        run: python -m pytest -q

      - name: Check Airflow DAG syntax
        run: python -m py_compile airflow/dags/project1_taxi_pipeline.py

      - name: Validate Docker Compose
        run: docker compose config >/dev/null

      - name: Initialize raw database
        run: psql -f db/scripts/sql/create_tables.sql

      - name: Load CI fixture
        run: psql -f tests/fixtures/ci_taxi_trips.sql

      - name: Set CI processing interval
        run: |
          START_DATE=$(psql -tAc "SELECT MIN(LEFT(trip_start_timestamp, 10)) FROM raw.taxi_trips;")
          LAST_DATE=$(psql -tAc "SELECT MAX(LEFT(trip_start_timestamp, 10)) FROM raw.taxi_trips;")
          END_DATE=$(date -I -d "$LAST_DATE + 1 day")
          echo "CI_START_DATE=$START_DATE" >> "$GITHUB_ENV"
          echo "CI_END_DATE=$END_DATE" >> "$GITHUB_ENV"
          echo "CI interval: [$START_DATE, $END_DATE)"

      - name: Build Airflow image
        run: docker build -f airflow.Dockerfile -t chicago-taxi-airflow-ci .

      - name: Build Spark image
        run: docker build -f spark.Dockerfile -t chicago-taxi-spark-ci .

      - name: Run Spark smoke test
        run: docker run --rm --network host -e POSTGRES_HOST=127.0.0.1 -e POSTGRES_PORT=5432 -e POSTGRES_USER=docker -e POSTGRES_PASSWORD=docker -e POSTGRES_DB=taxi_warehouse -v "$GITHUB_WORKSPACE:/app" chicago-taxi-spark-ci spark-submit --jars /opt/jdbc/postgresql.jar /app/spark/jobs/taxi_batch.py --start-date "$CI_START_DATE" --end-date "$CI_END_DATE"

      - name: Install dbt dependencies
        working-directory: dbt/chicago_taxi
        run: dbt deps --profiles-dir .

      - name: Compile dbt project
        working-directory: dbt/chicago_taxi
        run: dbt compile --profiles-dir .

      - name: Run dbt models
        working-directory: dbt/chicago_taxi
        run: dbt run --profiles-dir .

      - name: Run dbt tests
        working-directory: dbt/chicago_taxi
        run: dbt test --profiles-dir .